name: CI/CD

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt migrations/deployments. PRs and each release branch are isolated.
concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daloy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daloy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daloy_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daloy_ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply schema to disposable database
        run: npm run db:migrate
      - name: Unit and database integration tests
        run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy
    needs: verify
    # Manual runs verify only; only tested branch pushes can deploy.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      VERCEL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require deployment configuration
        shell: bash
        run: |
          for setting in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN EXPECTED_DATABASE_HOST PRODUCTION_DATABASE_HOST; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing GitHub environment setting: $setting"
              exit 1
            fi
          done
      - run: npm ci
      - name: Pull the selected Vercel environment
        run: npx --yes vercel@65.9.0 pull --yes --environment="$VERCEL_ENVIRONMENT" --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN"
      - name: Validate database isolation
        run: node --env-file=".vercel/.env.$VERCEL_ENVIRONMENT.local" --import tsx scripts/check-deployment-env.ts
      - name: Build deployment artifact
        shell: bash
        run: |
          flags=()
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then flags+=(--prod); fi
          npx --yes vercel@65.9.0 build "${flags[@]}" --token="$VERCEL_TOKEN"
      - name: Reject superseded commits before migration and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${process.env.GITHUB_REF_NAME}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error('Cannot verify the current release branch.');
          const reference = await response.json();
          if (reference.object.sha !== process.env.GITHUB_SHA) throw new Error('A newer commit exists. Deploy the latest successful run instead.');
          JS
      - name: Migrate selected Neon database
        run: node --env-file=".vercel/.env.$VERCEL_ENVIRONMENT.local" scripts/migrate.mjs
      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        run: |
          flags=()
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then flags+=(--prod); fi
          url=$(npx --yes vercel@65.9.0 deploy --prebuilt "${flags[@]}" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '### Deployment\n\nEnvironment: %s\n\nURL: %s\n' "$DEPLOY_ENVIRONMENT" "$url" >> "$GITHUB_STEP_SUMMARY"
